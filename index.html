<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="荷物">
<meta name="robots" content="noindex">
<title>荷物まとめて追跡</title>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbxH7xNOfWdJfOEXVOnDMpyTHfPYHz9LqMEARbtXuBcTtMAZLHxsA1zL__p5bLwg5juW/exec";
  var KEY_NAME = 'parcel_key', CACHE = 'parcel_view';
  window.PARCEL_STATIC = true;
  function store(){ try { return window.localStorage; } catch (e) { return null; } }
  var ls = store();
  
  
  var m = location.hash.match(/k=([0-9a-f]{20,})/);
  if (m && ls) { try { ls.setItem(KEY_NAME, m[1]); } catch (e) {} }
  var key = (ls ? ls.getItem(KEY_NAME) : null) || (m ? m[1] : null);

  function post(fn, args) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ key: key, fn: fn, args: args }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.ok) return j.result;
        if (j.error === 'auth' && ls) { try { ls.removeItem(KEY_NAME); } catch (e) {} }
        throw new Error(j.error === 'auth' ? '合言葉が違います。GAS の画面の「新しい画面へ」から開き直してください' : (j.error || 'エラー'));
      });
  }
  function call(fn, args, ok, ng) {
    var fail = function(err){ if (ng) ng(err); else console.error(err); };
    if (!key) { fail(new Error('合言葉がありません。GAS の画面の「新しい画面へ」から開いてください')); return; }
    post(fn, args).then(function(res){
      if (fn === 'getParcels' || fn === 'refreshAll') { try { ls.setItem(CACHE, JSON.stringify(res)); } catch (e) {} }
      if (ok) ok(res);
    }, fail);
  }
  function runner(ok, ng) {
    return new Proxy({}, { get: function(_, name){
      if (name === 'withSuccessHandler') return function(f){ return runner(f, ng); };
      if (name === 'withFailureHandler') return function(f){ return runner(ok, f); };
      return function(){ call(name, Array.prototype.slice.call(arguments), ok, ng); };
    }});
  }
  window.google = { script: { run: runner() } };
  
  window.PARCEL_CACHED = function(){ try { return JSON.parse(ls.getItem(CACHE)); } catch (e) { return null; } };
})();
</script>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1f23; --sub:#6b7079; --line:#e3e5e9; --accent:#2563eb;
          --ship:#0e7490; --go:#c2410c; --done:#15803d; --wait:#6b7079; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --sub:#9aa0a8; --line:#2c3037; --accent:#60a5fa;
            --ship:#22d3ee; --go:#fb923c; --done:#4ade80; --wait:#9aa0a8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif;
         padding:12px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  h1 { font-size:19px; margin:0; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px; padding:7px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  h2 { font-size:13px; color:var(--sub); margin:18px 0 6px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .top { display:flex; gap:8px; align-items:baseline; }
  .badge { font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; border:1.5px solid currentColor; white-space:nowrap; }
  .s-輸送中 { color:var(--ship); }
  .s-配達完了,.s-受取済み { color:var(--done); } .s-注文済み,.s-発送準備中,.s-キャンセル { color:var(--wait); }
  .item { font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .meta { color:var(--sub); font-size:13px; margin-top:4px; word-break:break-all; }
  .eta { color:var(--go); font-weight:600; font-size:13px; margin-top:2px; }
  .need { color:var(--sub); font-size:12px; margin-top:4px; }
  .late { color:#dc2626; font-weight:700; }
  .links { display:flex; gap:14px; margin-top:6px; font-size:13px; flex-wrap:wrap; align-items:center; }
  a { color:var(--accent); text-decoration:none; }
  .linkbtn { margin-left:auto; background:none; border:1.5px solid var(--line); border-radius:99px; padding:2px 10px; color:var(--sub); font-size:12px; font-weight:600; }
  form { display:flex; flex-direction:column; gap:8px; }
  input, select { font:16px inherit; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); width:100%; }
  .row { display:flex; gap:8px; }
  .empty { color:var(--sub); text-align:center; padding:20px 0; }
  #msg { color:var(--sub); font-size:13px; min-height:1em; }
  details summary { color:var(--sub); font-size:13px; cursor:pointer; margin:14px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>荷物まとめて追跡</h1>
  <button class="primary" id="refresh">今すぐ更新</button>
</header>
<div id="msg">読み込み中…</div>
<div id="active"></div>
<details id="doneBox"><summary>届いたもの（最近7日）</summary><div id="done"></div></details>
<div id="newPage" style="display:none;margin:14px 0"><a id="newPageLink" href="#" target="_blank">新しい画面へ（上の表示が出ない画面）</a></div>
<details>
  <summary>追跡番号を手で追加</summary>
  <div class="card">
    <form id="add">
      <input id="no" placeholder="追跡番号" inputmode="text" autocomplete="off">
      <div class="row">
        <select id="carrier">
          <option value="">運送会社（自動で判定）</option>
          <option>ヤマト運輸</option><option>佐川急便</option><option>日本郵便</option>
          <option>西濃運輸</option><option>福山通運</option><option>DHL</option><option>FedEx</option><option>UPS</option>
        </select>
      </div>
      <input id="memo" placeholder="メモ（商品名など・なくても可）">
      <button class="primary" type="submit">追加する</button>
    </form>
  </div>
</details>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const order = { '配達中':0, 'お届け予定':1, '輸送中':2, '発送済み':3, '発送準備中':4, '注文済み':5 };

function card(p) {
  
  const status = p['完了'] === '済' ? (p['状況'] === 'キャンセル' ? 'キャンセル' : '受取済み')
    : /注文済み|発送準備中/.test(p['状況'] || '') ? '注文済み' : '輸送中';
  const sub = [p['お店'], p['運送会社'] && p['運送会社'] !== '不明' ? p['運送会社'] : '', p['追跡番号']].filter(Boolean).join('・');
  let need = '';
  if (!p['追跡番号'] && status === '輸送中') {
    const days = p['発送日'] ? Math.floor((Date.now() - new Date(p['発送日'].replace(/-/g, '/'))) / 864e5) : null;
    need = days == null ? '<div class="need">追跡番号なし</div>'
      : days >= 7 ? `<div class="need late">追跡番号なし・発送から${days}日 → 届いていなければ確認してください</div>`
      : `<div class="need">追跡番号なし・発送から${days}日</div>`;
  }
  const links = [
    p.trackUrl ? `<a href="${esc(p.trackUrl)}" target="_blank">配送状況</a>` : '',
    p['リンク'] && p['リンク'] !== p.trackUrl ? `<a href="${esc(p['リンク'])}" target="_blank">注文ページ</a>` : '',
    
    p['完了'] === '済' ? `<button class="linkbtn" onclick="act('markUndone','${p['ID']}')">戻す</button>`
      : !p.autoCheck ? `<button class="linkbtn" onclick="act('markDone','${p['ID']}')">受取済みにする</button>` : ''
  ].filter(Boolean).join('');
  return `<div class="card">
    <div class="top"><span class="badge s-${esc(status)}">${esc(status)}</span><div class="item">${esc(p['商品名'] || '（商品名なし）')}</div></div>
    ${p['お届け予定'] ? `<div class="eta">お届け予定：${esc(p['お届け予定'])}</div>` : ''}
    <div class="meta">${esc(sub)}</div>
    ${p['詳細'] ? `<div class="meta">${esc(p['詳細'])}</div>` : ''}
    ${need}<div class="links">${links}</div></div>`;
}

function render(list) {
  const act = list.filter(p => p['完了'] !== '済').sort((a, b) => (order[a['状況']] ?? 9) - (order[b['状況']] ?? 9));
  const done = list.filter(p => p['完了'] === '済').sort((a, b) => b['更新日時'].localeCompare(a['更新日時']));
  $('#active').innerHTML = '<h2>届く予定（' + act.length + '件）</h2>' + (act.map(card).join('') || '<div class="empty">今届く予定の荷物はありません</div>');
  $('#done').innerHTML = done.map(card).join('') || '<div class="empty">なし</div>';
  $('#msg').textContent = '';
}

function load(fn) {
  $('#msg').textContent = fn === 'refreshAll' ? 'メールと配送状況を確認中…（少しかかります）' : '読み込み中…';
  google.script.run.withSuccessHandler(render).withFailureHandler(e => $('#msg').textContent = 'エラー：' + e.message)[fn]();
}
function act(fn, id) {
  google.script.run.withSuccessHandler(() => load('getParcels')).withFailureHandler(e => $('#msg').textContent = 'エラー：' + e.message)[fn](id);
}
$('#refresh').onclick = () => load('refreshAll');
$('#add').onsubmit = e => {
  e.preventDefault();
  $('#msg').textContent = '追加中…（運送会社を調べています）';
  google.script.run.withSuccessHandler(() => { $('#no').value = ''; $('#memo').value = ''; load('getParcels'); })
    .withFailureHandler(e => $('#msg').textContent = 'エラー：' + e.message)
    .addParcel($('#no').value, $('#carrier').value, $('#memo').value);
};
{ const c = window.PARCEL_CACHED && window.PARCEL_CACHED(); if (c) render(c); }
load('getParcels');

if (!window.PARCEL_STATIC) google.script.run.withSuccessHandler(u => { $('#newPageLink').href = u; $('#newPage').style.display = ''; }).getNewPageUrl();
</script>
</body>
</html>
